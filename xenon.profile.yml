# Xenon 用户插件清单（用户层，叠加在内置清单 xenon_core/plugins/manifest.yml 之后）
#
# 覆盖规则（与内置清单同构，按 id 寻址，后写覆盖先写）：
#   - 同 id 提供 config 整行替换内置配置（不深合并）
#   - enabled: false 禁用；disabled: true 移除该行
#   - optional: true 的插件加载失败时跳过，不阻断启动
#
# 示例：
# plugins:
#   - id: semantic-router
#     config:
#       model: deepseek-v4-flash
#       max_tokens: 600
#   - id: heartbeat
#     enabled: true        # 手动接管心跳（需先停用入口自带的心跳）
#
# 回滚开关：环境变量 XENON_PLUGINS=off 可跳过全部插件装配。

plugins: []
